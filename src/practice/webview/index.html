<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Content-Security-Policy"
    content="default-src 'none'; style-src {{cspSource}} 'unsafe-inline'; script-src 'nonce-{{nonce}}';" />
  <link rel="stylesheet" href="{{stylesUri}}" />
  <title>Practice</title>
</head>
<body>
  <div id="app">
    <header class="q-head">
      <div id="question-meta" class="q-meta"></div>
      <div class="q-title-row">
        <h1 id="question-title" class="q-title"></h1>
        <button id="btn-favorite" class="q-fav" type="button" aria-label="收藏" title="收藏">
          <span class="fav-icon" aria-hidden="true"></span>
        </button>
      </div>
    </header>

    <article id="question-content" class="md"></article>

    <section id="test-cases" class="test-cases"></section>

    <section id="answer-area" class="answer-area hidden"></section>

    <section id="follow-ups" class="follow-ups"></section>

    <div class="action-bar" role="toolbar" aria-label="题目操作">
      <button id="btn-show-answer" class="btn primary" type="button">查看答案</button>
      <div class="segmented" role="radiogroup" aria-label="掌握状态">
        <button class="seg" type="button" data-mastery="unlearned" role="radio">未学习</button>
        <button class="seg" type="button" data-mastery="learning" role="radio">学习中</button>
        <button class="seg" type="button" data-mastery="mastered" role="radio">已掌握</button>
        <button class="seg" type="button" data-mastery="not_mastered" role="radio">未掌握</button>
      </div>
      <span class="action-spacer"></span>
      <div class="note-links">
        <button id="link-open-note" class="btn ghost" type="button">打开笔记</button>
        <button id="link-note-preview" class="btn ghost" type="button">预览笔记</button>
      </div>
    </div>

    <div id="status-message" class="status-message" role="status" aria-live="polite"></div>
  </div>

  <script nonce="{{nonce}}" src="{{scriptUri}}"></script>
</body>
</html>
